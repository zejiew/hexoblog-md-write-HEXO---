<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写作台 · Markdown</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-bold" viewBox="0 0 24 24"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7z"/><path d="M7 12h7a3.5 3.5 0 0 1 0 7H7z"/></symbol>
  <symbol id="i-italic" viewBox="0 0 24 24"><path d="M15 4H9"/><path d="M15 20H9"/><path d="M14 4 10 20"/></symbol>
  <symbol id="i-strike" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M16 7c-.6-1.6-2.2-2.5-4.2-2.5C9.3 4.5 8 5.7 8 7.3c0 1.1.7 1.9 2 2.4"/><path d="M8 17c.7 1.6 2.3 2.5 4.3 2.5 2.6 0 3.9-1.2 3.9-2.8 0-1-.5-1.7-1.4-2.2"/></symbol>
  <symbol id="i-quote" viewBox="0 0 24 24"><path d="M4 6h7v7c0 4-2.4 6-6 6"/><path d="M14 6h6v7c0 4-2.4 6-6 6"/></symbol>
  <symbol id="i-ul" viewBox="0 0 24 24"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></symbol>
  <symbol id="i-ol" viewBox="0 0 24 24"><path d="M10 6h10"/><path d="M10 12h10"/><path d="M10 18h10"/><path d="M4 5h1v4"/><path d="M4 15h2v.5L4 18h2"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="m15 7 5 5-5 5"/></symbol>
  <symbol id="i-codeblock" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m9 10-2 2 2 2"/><path d="m15 10 2 2-2 2"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 3 3 3-2 5 4"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M9 10v10"/></symbol>
  <symbol id="i-hr" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M4 7h4"/><path d="M16 17h4"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7"/><rect x="8" y="13" width="8" height="7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M5 15c-1 1-1 5-1 5s4 0 5-1"/><path d="M9 15 4 10c3-1 6 0 8 2"/><path d="M9 15c-1-3 0-6 2-8 3-3 7-4 9-4 0 2-1 6-4 9-2 2-5 3-8 2z"/><circle cx="15" cy="9" r="1.4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">写作台</span>
    </div>

    <input id="title" class="title-input" placeholder="文章标题…" autocomplete="off" spellcheck="false">

    <div class="top-actions">
      <button id="btn-new" class="btn ghost" title="新建文章 (Ctrl+N)"><svg class="ic"><use href="#i-plus"/></svg><span>新建</span></button>
      <button id="btn-save" class="btn primary" title="保存到 source/_posts (Ctrl+S)"><svg class="ic"><use href="#i-save"/></svg><span>保存</span></button>
      <button id="btn-deploy" class="btn ghost" title="hexo clean && hexo g -d"><svg class="ic"><use href="#i-rocket"/></svg><span>发布</span></button>
      <button id="btn-settings" class="icon-btn" title="设置"><svg class="ic"><use href="#i-gear"/></svg></button>
      <button id="btn-theme" class="icon-btn" title="切换主题"><svg class="ic"><use href="#i-moon"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <div class="search-box">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="search" placeholder="搜索文章" autocomplete="off">
        </div>
        <button id="btn-refresh" class="icon-btn" title="刷新列表"><svg class="ic"><use href="#i-refresh"/></svg></button>
      </div>
      <div id="post-list" class="post-list"></div>
      <div class="side-foot">
        <span id="imgbed-state" class="pill idle">图床检测中…</span>
        <span id="post-count" class="muted"></span>
      </div>
    </aside>

    <main class="main">
      <div class="meta-bar">
        <label class="field">
          <span>文件名</span>
          <input id="filename" placeholder="自动取自标题.md" spellcheck="false">
        </label>
        <label class="field grow">
          <span>标签</span>
          <input id="tags" placeholder="生活, 技术" spellcheck="false">
        </label>
        <label class="field">
          <span>分类</span>
          <input id="categories" placeholder="随笔" spellcheck="false">
        </label>
        <label class="field">
          <span>日期</span>
          <input id="date" type="date">
        </label>
      </div>

      <div class="toolbar">
        <div class="tb-group">
          <button class="tb" data-act="h1" title="一级标题">H1</button>
          <button class="tb" data-act="h2" title="二级标题">H2</button>
          <button class="tb" data-act="h3" title="三级标题">H3</button>
        </div>
        <div class="tb-group">
          <button class="tb" data-act="bold" title="粗体 (Ctrl+B)"><svg class="ic"><use href="#i-bold"/></svg></button>
          <button class="tb" data-act="italic" title="斜体 (Ctrl+I)"><svg class="ic"><use href="#i-italic"/></svg></button>
          <button class="tb" data-act="strike" title="删除线"><svg class="ic"><use href="#i-strike"/></svg></button>
        </div>
        <div class="tb-group">
          <button class="tb" data-act="quote" title="引用"><svg class="ic"><use href="#i-quote"/></svg></button>
          <button class="tb" data-act="ul" title="无序列表"><svg class="ic"><use href="#i-ul"/></svg></button>
          <button class="tb" data-act="ol" title="有序列表"><svg class="ic"><use href="#i-ol"/></svg></button>
        </div>
        <div class="tb-group">
          <button class="tb" data-act="code" title="行内代码"><svg class="ic"><use href="#i-code"/></svg></button>
          <button class="tb" data-act="codeblock" title="代码块"><svg class="ic"><use href="#i-codeblock"/></svg></button>
          <button class="tb" data-act="link" title="链接 (Ctrl+K)"><svg class="ic"><use href="#i-link"/></svg></button>
          <button class="tb" data-act="table" title="表格"><svg class="ic"><use href="#i-table"/></svg></button>
          <button class="tb" data-act="hr" title="分割线"><svg class="ic"><use href="#i-hr"/></svg></button>
        </div>
        <div class="tb-spacer"></div>
        <button id="btn-upload" class="tb upload" title="上传图片并插入链接">
          <svg class="ic"><use href="#i-image"/></svg>
          <span>插入图片</span>
        </button>
        <div class="view-switch" role="tablist">
          <button data-view="edit" class="vs" title="仅编辑"><svg class="ic"><use href="#i-pen"/></svg></button>
          <button data-view="split" class="vs active" title="分栏"><svg class="ic"><use href="#i-split"/></svg></button>
          <button data-view="preview" class="vs" title="仅预览"><svg class="ic"><use href="#i-eye"/></svg></button>
        </div>
      </div>

      <div class="panes" id="panes" data-view="split">
        <div class="pane editor-pane">
          <textarea id="editor" spellcheck="false" placeholder="开始写作…  直接粘贴截图即可自动上传图床并插入链接"></textarea>
          <div class="drop-hint" id="drop-hint">
            <svg class="ic"><use href="#i-image"/></svg>
            <span>松手上传到图床</span>
          </div>
        </div>
        <div class="pane preview-pane">
          <article id="preview" class="markdown-body"></article>
        </div>
      </div>

      <div class="statusbar">
        <span id="save-state" class="status-item">未保存</span>
        <span class="divider"></span>
        <span id="stat-chars" class="status-item">0 字</span>
        <span id="stat-lines" class="status-item">0 行</span>
        <span class="divider"></span>
        <span id="upload-state" class="status-item"></span>
        <span class="tb-spacer"></span>
        <button id="btn-copy" class="link-btn" title="复制全文"><svg class="ic"><use href="#i-copy"/></svg> 复制全文</button>
        <span class="muted small" id="hint">Ctrl+S 保存 · Ctrl+B 粗体 · 粘贴截图上传</span>
      </div>
    </main>
  </div>
</div>

<input type="file" id="file-input" accept="image/*" multiple hidden>

<!-- 设置面板 -->
<div class="modal-mask" id="settings-mask" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>设置</h3>
      <button class="icon-btn" data-close-settings>✕</button>
    </div>
    <div class="modal-body">
      <div class="row">
        <label for="cfg-imgbed">图床地址</label>
        <input id="cfg-imgbed" type="url" placeholder="https://你的图床域名" autocomplete="off" spellcheck="false">
        <div class="hint" id="cfg-imgbed-hint">填 CloudFlare-ImgBed 的站点根地址，例如 <code>https://img.example.com</code>，不要带 <code>/upload</code>。只保存在本机浏览器里。</div>
      </div>
      <div class="row">
        <label for="cfg-authcode">上传认证码</label>
        <input id="cfg-authcode" type="password" placeholder="图床后台设置的认证码，没有就留空" autocomplete="off">
        <div class="hint">只保存在本机浏览器里，上传时随请求发送。</div>
      </div>
      <div class="row">
        <label for="cfg-format">插入格式</label>
        <select id="cfg-format">
          <option value="markdown">Markdown  ![](url)</option>
          <option value="html">&lt;img src="url"&gt;</option>
          <option value="url">纯链接 url</option>
        </select>
      </div>
      <div class="row inline">
        <input type="checkbox" id="cfg-autocopy">
        <label for="cfg-autocopy">上传成功后自动复制链接</label>
      </div>
      <div class="row inline">
        <input type="checkbox" id="cfg-autosave">
        <label for="cfg-autosave">自动保存草稿到本地（防止误关页面）</label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close-settings>取消</button>
      <button class="btn primary" id="btn-save-settings">保存设置</button>
    </div>
  </div>
</div>

<!-- 构建日志 -->
<div class="drawer" id="build-drawer" hidden>
  <div class="drawer-head">
    <strong>Hexo 构建日志</strong>
    <span id="build-state" class="pill idle">等待</span>
    <span class="tb-spacer"></span>
    <button class="icon-btn" id="btn-close-drawer">✕</button>
  </div>
  <pre id="build-log"></pre>
</div>

<div class="toasts" id="toasts"></div>

<script src="/vendor/marked.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
